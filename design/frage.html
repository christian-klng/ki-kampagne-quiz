<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Frage 3 von 10 · Quiz Generative KI</title>
  <link rel="icon" href="../public/img/ai-up.png">
  <link rel="preload" href="../public/fonts/geist/geist-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
  <div class="screen">
    <!-- Bild links (Standard). Für Bild rechts: class="stage layout-question is-image-right" -->
    <main class="stage layout-question">
      <div class="content">
        <figure class="quiz-image">
          <img src="../public/img/turing-test.jpg" alt="Mann im Kittel sitzt vor einem großen Schaltpult mit Lautsprechern und Mikrofon">
          <figcaption>Bild KI-generiert</figcaption>
        </figure>
        <section class="question mark">
          <p class="kicker">Geschichte der KI</p>
          <h1>In welchem Jahr beschrieb Alan Turing das „Imitation Game“?</h1>
          <ol class="answers">
            <li><button type="button" class="answer" aria-pressed="false">1936</button></li>
            <li><button type="button" class="answer" aria-pressed="true">1950</button></li>
            <li><button type="button" class="answer" aria-pressed="false">1969</button></li>
            <li><button type="button" class="answer" aria-pressed="false">1997</button></li>
          </ol>
          <div class="actions">
            <a class="button" href="antwort.html">Antwort prüfen</a>
          </div>
        </section>
      </div>
      <footer>
        <a class="brand" href="index.html">ai up</a>
        <progress class="progress" value="3" max="10">3 von 10</progress>
        <span class="page">3 / 10</span>
      </footer>
    </main>
  </div>
</body>
</html>
